name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared minimum and a current LTS. The minimum is the one that
        # actually catches things.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  canonical-host-integration:
    runs-on: [self-hosted, macOS, tems-canonical-host]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:host-integration
      - run: git diff --exit-code -- test/fixtures/tems-host-integration-receipt.json
